<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="600" viewBox="0 0 1350 600" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Fluxograma do processo de avaliação por observação de usuários — Entrega 14</title>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#24292f"/>
    </marker>
    <style>
      .etapa { fill: #ffffff; stroke: #24292f; stroke-width: 2; }
      .nao-feita { fill: #f6f8fa; stroke: #8c959f; stroke-width: 2; stroke-dasharray: 8 5; }
      .simulada { fill: #fff8e1; stroke: #9a6700; stroke-width: 2; }
      .decisao { fill: #eef4ff; stroke: #0550ae; stroke-width: 2; }
      .terminal { fill: #24292f; }
      .t { font-size: 14px; fill: #24292f; text-anchor: middle; }
      .tb { font-size: 14px; font-weight: bold; fill: #24292f; text-anchor: middle; }
      .tc { font-size: 14px; fill: #57606a; text-anchor: middle; }
      .tw { font-size: 15px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
      .rot { font-size: 13px; fill: #0550ae; font-weight: bold; }
      .lig { stroke: #24292f; stroke-width: 2; fill: none; marker-end: url(#seta); }
      .leg { font-size: 13px; fill: #24292f; }
    </style>
  </defs>
  <rect width="1350" height="600" fill="#ffffff"/>

  <!-- Linha 1: da esquerda para a direita -->
  <ellipse class="terminal" cx="100" cy="90" rx="70" ry="30"/>
  <text class="tw" x="100" y="95">Início</text>

  <rect class="etapa" x="230" y="50" width="210" height="80" rx="8"/>
  <text class="tb" x="335" y="78">1. Planejamento</text>
  <text class="t" x="335" y="98">método DECIDE, tarefas,</text>
  <text class="t" x="335" y="116">instrumentos (Entrega 12)</text>

  <rect class="etapa" x="500" y="50" width="210" height="80" rx="8"/>
  <text class="tb" x="605" y="78">2. Inspeção heurística</text>
  <text class="t" x="605" y="98">AV01–AV03, HC01–HC27</text>
  <text class="t" x="605" y="116">(Entrega 13)</text>

  <rect class="nao-feita" x="770" y="50" width="210" height="80" rx="8"/>
  <text class="tb" x="875" y="78">3. Correções e pilotos</text>
  <text class="tc" x="875" y="98">HC01–HC03; piloto técnico</text>
  <text class="tc" x="875" y="116">e de compreensão</text>

  <rect class="simulada" x="1030" y="50" width="200" height="80" rx="8"/>
  <text class="tb" x="1130" y="78">4. Recrutamento</text>
  <text class="t" x="1130" y="98">participantes aproximados</text>
  <text class="t" x="1130" y="116">U01, U02, U03</text>

  <path class="lig" d="M170,90 L228,90"/>
  <path class="lig" d="M440,90 L498,90"/>
  <path class="lig" d="M710,90 L768,90"/>
  <path class="lig" d="M980,90 L1028,90"/>
  <path class="lig" d="M1130,130 L1130,213"/>

  <!-- Linha 2: da direita para a esquerda -->
  <polygon class="decisao" points="1130,215 1220,270 1130,325 1040,270"/>
  <text class="tb" x="1130" y="266">Aceita o termo</text>
  <text class="tb" x="1130" y="284">(E.1)?</text>
  <path class="lig" d="M1220,270 L1265,270 L1265,90 L1232,90"/>
  <text class="rot" x="1272" y="168">não:</text>
  <text class="rot" x="1272" y="184">convidar</text>
  <text class="rot" x="1272" y="200">outra</text>
  <text class="rot" x="1272" y="216">pessoa</text>

  <rect class="simulada" x="770" y="230" width="210" height="80" rx="8"/>
  <text class="tb" x="875" y="256">5. Preparação</text>
  <text class="t" x="875" y="276">folha E.6, cópia dos dados</text>
  <text class="t" x="875" y="294">restaurada, estado inicial</text>
  <path class="lig" d="M1040,270 L982,270"/>
  <text class="rot" x="996" y="262">sim</text>

  <rect class="simulada" x="500" y="230" width="210" height="80" rx="8"/>
  <text class="tb" x="605" y="256">6. Tarefas e observação</text>
  <text class="t" x="605" y="276">UT01–UT04, pensar em voz</text>
  <text class="t" x="605" y="294">alta, planilha E.3</text>
  <path class="lig" d="M770,270 L712,270"/>

  <rect class="simulada" x="230" y="230" width="210" height="80" rx="8"/>
  <text class="tb" x="335" y="256">7. Pós-teste</text>
  <text class="t" x="335" y="276">facilidade 1–7, questionário</text>
  <text class="t" x="335" y="294">E.4, conversa, SUS</text>
  <path class="lig" d="M500,270 L442,270"/>

  <polygon class="decisao" points="100,215 190,270 100,325 10,270"/>
  <text class="tb" x="100" y="266">Falta algum</text>
  <text class="tb" x="100" y="284">participante?</text>
  <path class="lig" d="M230,270 L192,270"/>
  <path class="lig" d="M100,215 L100,180 L1130,180 L1130,213"/>
  <text class="rot" x="420" y="172">sim: próximo participante (U01 → U02 → U03)</text>

  <!-- Linha 3: da esquerda para a direita -->
  <path class="lig" d="M100,325 L100,408"/>
  <text class="rot" x="110" y="372">não</text>

  <rect class="etapa" x="10" y="410" width="210" height="80" rx="8"/>
  <text class="tb" x="115" y="436">8. Análise</text>
  <text class="t" x="115" y="456">codificação das falas; por</text>
  <text class="t" x="115" y="474">participante e por tarefa</text>

  <rect class="etapa" x="280" y="410" width="210" height="80" rx="8"/>
  <text class="tb" x="385" y="436">9. Comparação</text>
  <text class="t" x="385" y="456">metas MU/MQ e</text>
  <text class="t" x="385" y="474">inspeção (Entrega 13)</text>
  <path class="lig" d="M220,450 L278,450"/>

  <rect class="etapa" x="550" y="410" width="210" height="80" rx="8"/>
  <text class="tb" x="655" y="436">10. Recomendações</text>
  <text class="t" x="655" y="456">achados AU, mudanças</text>
  <text class="t" x="655" y="474">na rastreabilidade (§3)</text>
  <path class="lig" d="M490,450 L548,450"/>

  <ellipse class="terminal" cx="890" cy="450" rx="70" ry="30"/>
  <text class="tw" x="890" y="455">Fim</text>
  <path class="lig" d="M760,450 L818,450"/>

  <!-- Legenda -->
  <rect x="990" y="395" width="270" height="190" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text class="leg" x="1005" y="418" font-weight="bold">Legenda</text>
  <rect class="etapa" x="1005" y="430" width="36" height="20" rx="4"/>
  <text class="leg" x="1050" y="445">etapa realizada</text>
  <rect class="simulada" x="1005" y="460" width="36" height="20" rx="4"/>
  <text class="leg" x="1050" y="475">etapa simulada (didático)</text>
  <rect class="nao-feita" x="1005" y="490" width="36" height="20" rx="4"/>
  <text class="leg" x="1050" y="505">prevista, não realizada</text>
  <polygon class="decisao" points="1023,518 1041,530 1023,542 1005,530"/>
  <text class="leg" x="1050" y="535">decisão</text>
  <ellipse class="terminal" cx="1023" cy="562" rx="18" ry="10"/>
  <text class="leg" x="1050" y="567">início ou fim</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
