<rect x="40.0" y="652" width="315.0" height="122" fill="#ececec" rx="16" stroke="#333" stroke-width="1.6" class="frame"/>
<text x="197.5" y="678" text-anchor="middle" font-size="16" font-weight="400">A1. Entender o que</text>
<text x="197.5" y="701" text-anchor="middle" font-size="16" font-weight="400">as métricas e a</text>
<text x="197.5" y="724" text-anchor="middle" font-size="16" font-weight="400">diferença indicam</text>
</g>
<path d="M542.5 613 V652" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
<g data-box="b7">
<rect x="385.0" y="652" width="315.0" height="122" fill="#ececec" rx="16" stroke="#333" stroke-width="1.6" stroke-dasharray="8 5" class="frame"/>
<text x="542.5" y="678" text-anchor="middle" font-size="16" font-weight="400">A2. Execuções e</text>
<text x="542.5" y="701" text-anchor="middle" font-size="16" font-weight="400">avaliações faltantes</text>
<text x="542.5" y="724" text-anchor="middle" font-size="16" font-weight="400">pedidas ao integrante</text>
<text x="542.5" y="747" text-anchor="middle" font-size="16" font-weight="400">técnico</text>
</g>
<g data-box="b8">
<rect x="850.0" y="506" width="460.0" height="53" fill="white" stroke="#333" stroke-width="1.6" class="frame"/>
<text x="1080.0" y="532" text-anchor="middle" font-size="16" font-weight="400">C. Decisão da coordenação registrada</text>
</g>
