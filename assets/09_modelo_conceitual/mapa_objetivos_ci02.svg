<rect x="80.0" y="298" width="400.0" height="122" fill="white" stroke="#333" stroke-width="1.6" class="frame"/>
<text x="280.0" y="324" text-anchor="middle" font-size="16" font-weight="400">A. Saber como as</text>
<text x="280.0" y="347" text-anchor="middle" font-size="16" font-weight="400">configurações do ciclo</text>
<text x="280.0" y="370" text-anchor="middle" font-size="16" font-weight="400">se saem no conjunto</text>
<text x="280.0" y="393" text-anchor="middle" font-size="16" font-weight="400">de teste</text>
</g>
<path d="M720.0 259 V298" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
<g data-box="b3">
<rect x="520.0" y="298" width="400.0" height="122" fill="white" stroke="#333" stroke-width="1.6" class="frame"/>
<text x="720.0" y="324" text-anchor="middle" font-size="16" font-weight="400">B. Recomendação</text>
<text x="720.0" y="347" text-anchor="middle" font-size="16" font-weight="400">registrada, com</text>
<text x="720.0" y="370" text-anchor="middle" font-size="16" font-weight="400">as ressalvas</text>
</g>
<path d="M1160.0 259 V298" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
<g data-box="b4">
<rect x="960.0" y="298" width="400.0" height="122" fill="white" stroke="#333" stroke-width="1.6" class="frame"/>
<text x="1160.0" y="324" text-anchor="middle" font-size="16" font-weight="400">C. Decisão da</text>
<text x="1160.0" y="347" text-anchor="middle" font-size="16" font-weight="400">coordenação registrada</text>
<text x="1160.0" y="370" text-anchor="middle" font-size="16" font-weight="400">junto da recomendação</text>
</g>
<path d="M40 454 H1400" fill="none" stroke="#333" stroke-width="1.6"/>
<text x="40" y="484" text-anchor="start" font-size="18" font-weight="700">Objetivos instrumentais indiretos</text>
<g data-box="b5">
<rect x="140.0" y="506" width="460.0" height="76" fill="white" stroke="#333" stroke-width="1.6" class="frame"/>
<text x="370.0" y="532" text-anchor="middle" font-size="16" font-weight="400">A. Saber como as configurações</text>
<text x="370.0" y="555" text-anchor="middle" font-size="16" font-weight="400">se saem no conjunto de teste</text>
</g>
<path d="M370.0 582 V613" fill="none" stroke="#333" stroke-width="1.6"/>
<path d="M197.5 613 H542.5" fill="none" stroke="#333" stroke-width="1.6"/>
