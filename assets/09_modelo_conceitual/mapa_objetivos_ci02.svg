<text x="720.0" y="178" text-anchor="middle" font-size="16" font-weight="400">Configuração do ciclo de testes escolhida</text>
<text x="720.0" y="201" text-anchor="middle" font-size="16" font-weight="400">e sustentada perante a coordenação</text>
</g>
