<text x="40" y="73" text-anchor="start" font-size="16" font-weight="400">Mateus Marana Assuena · 22.123.026-1 · origem: C03 → CI03 · T08, T02, T06 e T07 · Proposta [H]</text>
<path d="M40 100 H1400" fill="none" stroke="#333" stroke-width="1.6"/>
