<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1086" viewBox="0 0 1440 1086" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
<title id="title">Mapa de objetivos — P02, Andreia Silva (CI03)</title>
<desc id="desc">Mapa de objetivos individual por Mateus Marana Assuena. Objetivo final da P02, objetivos instrumentais diretos e indiretos, todos escritos como resultados desejados. Caixas tracejadas são objetivos alcançados fora do sistema.</desc>
