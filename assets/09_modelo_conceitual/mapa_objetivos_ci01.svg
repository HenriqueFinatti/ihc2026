<rect x="400.0" y="152" width="640.0" height="76" fill="white" stroke="#333" stroke-width="3.4" class="frame"/>
<text x="720.0" y="178" text-anchor="middle" font-size="16" font-weight="400">Equipe sabe, antes do próximo teste, se a</text>
<text x="720.0" y="201" text-anchor="middle" font-size="16" font-weight="400">configuração em uso pode continuar</text>
</g>
