<rect x="732.0" y="298" width="322.0" height="122" fill="white" stroke="#333" stroke-width="1.6" class="frame"/>
<text x="893.0" y="324" text-anchor="middle" font-size="16" font-weight="400">C. Conclusão da</text>
<text x="893.0" y="347" text-anchor="middle" font-size="16" font-weight="400">validação registrada</text>
</g>
<path d="M1239.0 259 V298" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
