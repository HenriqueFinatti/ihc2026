<text x="370.0" y="555" text-anchor="middle" font-size="16" font-weight="400">a origem de cada problema</text>
</g>
<path d="M370.0 582 V613" fill="none" stroke="#333" stroke-width="1.6"/>
<path d="M197.5 613 H542.5" fill="none" stroke="#333" stroke-width="1.6"/>
