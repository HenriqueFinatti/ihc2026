<rect x="386.0" y="298" width="322.0" height="122" fill="white" stroke="#333" stroke-width="1.6" class="frame"/>
<text x="547.0" y="324" text-anchor="middle" font-size="16" font-weight="400">B. Saber se outra</text>
<text x="547.0" y="347" text-anchor="middle" font-size="16" font-weight="400">configuração delimita</text>
<text x="547.0" y="370" text-anchor="middle" font-size="16" font-weight="400">melhor a trilha nas</text>
<text x="547.0" y="393" text-anchor="middle" font-size="16" font-weight="400">imagens duvidosas</text>
</g>
<path d="M893.0 259 V298" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
