<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1066" viewBox="0 0 1440 1066" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
<title id="title">Mapa de objetivos — P01, Rafael Pereira (CI01)</title>
<desc id="desc">Mapa de objetivos individual por Tiago Fagundes dos Santos. Objetivo final da P01, objetivos instrumentais diretos e indiretos, todos escritos como resultados desejados. Caixas tracejadas são objetivos alcançados fora do sistema.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#333"/></marker></defs>
<rect width="1440" height="1066" fill="white"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#222">
<text x="40" y="40" text-anchor="start" font-size="25" font-weight="700">Mapa de objetivos — P01, Rafael Pereira (CI01)</text>
<text x="40" y="73" text-anchor="start" font-size="16" font-weight="400">Tiago Fagundes dos Santos · 22.123.017-0 · origem: C01 → CI01 · T01, T02 e T03 · Proposta [H]</text>
<path d="M40 100 H1400" fill="none" stroke="#333" stroke-width="1.6"/>
<text x="40" y="130" text-anchor="start" font-size="18" font-weight="700">Objetivo final e objetivos instrumentais diretos</text>
