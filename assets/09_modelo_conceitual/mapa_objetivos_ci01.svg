<rect x="40.0" y="652" width="315.0" height="99" fill="#ececec" rx="16" stroke="#333" stroke-width="1.6" class="frame"/>
<text x="197.5" y="678" text-anchor="middle" font-size="16" font-weight="400">A1. Imagens do teste</text>
<text x="197.5" y="701" text-anchor="middle" font-size="16" font-weight="400">segmentadas com a</text>
<text x="197.5" y="724" text-anchor="middle" font-size="16" font-weight="400">configuração em uso</text>
</g>
<path d="M542.5 613 V652" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
<g data-box="b8">
<rect x="385.0" y="652" width="315.0" height="99" fill="#ececec" rx="16" stroke="#333" stroke-width="1.6" stroke-dasharray="8 5" class="frame"/>
<text x="542.5" y="678" text-anchor="middle" font-size="16" font-weight="400">A2. Imagens do teste</text>
<text x="542.5" y="701" text-anchor="middle" font-size="16" font-weight="400">obtidas das câmeras</text>
</g>
<g data-box="b9">
<rect x="900.0" y="506" width="360.0" height="76" fill="white" stroke="#333" stroke-width="1.6" class="frame"/>
<text x="1080.0" y="532" text-anchor="middle" font-size="16" font-weight="400">B. Saber se outra configuração</text>
<text x="1080.0" y="555" text-anchor="middle" font-size="16" font-weight="400">delimita melhor a trilha</text>
</g>
<path d="M1080.0 582 V613" fill="none" stroke="#333" stroke-width="1.6"/>
<path d="M1080.0 613 H1080.0" fill="none" stroke="#333" stroke-width="1.6"/>
