<rect x="40.0" y="298" width="322.0" height="122" fill="white" stroke="#333" stroke-width="1.6" class="frame"/>
<text x="201.0" y="324" text-anchor="middle" font-size="16" font-weight="400">A. Imagens do teste</text>
<text x="201.0" y="347" text-anchor="middle" font-size="16" font-weight="400">avaliadas, com a origem</text>
<text x="201.0" y="370" text-anchor="middle" font-size="16" font-weight="400">de cada problema</text>
</g>
<path d="M547.0 259 V298" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
