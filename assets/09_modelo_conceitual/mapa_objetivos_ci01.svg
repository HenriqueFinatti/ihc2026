<path d="M40 808 H1400" fill="none" stroke="#333" stroke-width="1.6"/>
<text x="40" y="838" text-anchor="start" font-size="18" font-weight="700">Legenda</text>
<g data-box="b11">
<rect x="40.0" y="860" width="220.0" height="50" fill="white" stroke="#333" stroke-width="3.4" class="frame"/>
<text x="150" y="886" text-anchor="middle" font-size="16" font-weight="400">objetivo final</text>
</g>
<g data-box="b12">
<rect x="290.0" y="860" width="220.0" height="50" fill="white" stroke="#333" stroke-width="1.6" class="frame"/>
<text x="400" y="886" text-anchor="middle" font-size="16" font-weight="400">instrumental direto</text>
</g>
<g data-box="b13">
<rect x="540.0" y="860" width="220.0" height="50" fill="#ececec" rx="16" stroke="#333" stroke-width="1.6" class="frame"/>
<text x="650" y="886" text-anchor="middle" font-size="16" font-weight="400">instrumental indireto</text>
</g>
<g data-box="b14">
<rect x="790.0" y="860" width="220.0" height="50" fill="white" stroke="#333" stroke-width="1.6" stroke-dasharray="8 5" class="frame"/>
<text x="900" y="886" text-anchor="middle" font-size="16" font-weight="400">fora do sistema</text>
</g>
<text x="40" y="946" text-anchor="start" font-size="14" font-weight="400">Objetivo final: o que a persona quer alcançar no fim. Instrumental direto: resultado que leva diretamente ao objetivo final.</text>
<text x="40" y="966" text-anchor="start" font-size="14" font-weight="400">Instrumental indireto: resultado que serve a outro objetivo instrumental. Caixa tracejada: objetivo alcançado entre pessoas, fora do sistema (RQ09).</text>
<text x="40" y="986" text-anchor="start" font-size="14" font-weight="400">Cada caixa é um resultado desejado, não um passo da interação; os passos ficam nos diálogos (subtópicos) da seção 2 e na tabela de subtópicos.</text>
<text x="40" y="1006" text-anchor="start" font-size="14" font-weight="400">Letras: numeração deste mapa; os IDs O01… do mapa consolidado estão na tabela de correspondência da seção 3.2 da Entrega 9.</text>
<text x="40" y="1026" text-anchor="start" font-size="14" font-weight="400">[H]: proposta derivada de proto-persona, a revisar depois da coleta da Entrega 7.</text>
</g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
