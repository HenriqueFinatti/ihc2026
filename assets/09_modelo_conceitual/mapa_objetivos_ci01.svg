<rect x="900.0" y="652" width="360.0" height="122" fill="#ececec" rx="16" stroke="#333" stroke-width="1.6" class="frame"/>
<text x="1080.0" y="678" text-anchor="middle" font-size="16" font-weight="400">B1. Imagens duvidosas</text>
<text x="1080.0" y="701" text-anchor="middle" font-size="16" font-weight="400">segmentadas também</text>
<text x="1080.0" y="724" text-anchor="middle" font-size="16" font-weight="400">com a outra</text>
<text x="1080.0" y="747" text-anchor="middle" font-size="16" font-weight="400">configuração</text>
