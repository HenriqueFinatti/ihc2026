<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="872" viewBox="0 0 1280 872" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">Mapa de empatia — Rafael Pereira (P01)</title>
<desc id="d">Mapa de empatia da proto-persona P01 com seis dimensões: o que ouve, pensa e sente, vê, fala e faz, dores, necessidades e ganhos. Cada bloco traz a base [F] ou [H] usada na tabela da Entrega 3.</desc>
<defs><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.15"/></filter></defs>
<rect width="1280" height="872" fill="#F6F8FC"/>
<text x="52" y="62" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="34" font-weight="700" fill="#15365A">Mapa de Empatia — Rafael Pereira</text>
<rect x="786" y="22" width="470" height="58" rx="10" fill="#DCE8F6" filter="url(#sh)"/>
<text x="1021.0" y="47" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#15365A">22 anos | Ciência da Computação | Baja FEI</text>
<text x="1021.0" y="68" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#15365A">Proto-persona P01 — conteúdo hipotético, salvo o marcado [F]</text>
<rect x="24" y="104" width="606" height="201" rx="22" fill="#FFF3D9" filter="url(#sh)"/>
<circle cx="68" cy="146" r="24" fill="#15365A"/>
<text x="68" y="154" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff">◉</text>
<text x="108" y="144" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="22" font-weight="700" fill="#15365A">O que ouve?</text>
<text x="108" y="166" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-style="italic" fill="#3D5675">Base: [H] H01, H04</text>
<text x="64" y="196" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#1F2D3D" xml:space="preserve">• Feedback de professores e colegas sobre o desempenho dos modelos.</text>
<text x="64" y="217" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#1F2D3D" xml:space="preserve">• Discussões sobre melhorias no sistema.</text>
<text x="64" y="238" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#1F2D3D" xml:space="preserve">• Comentários sobre tempo de execução e precisão das segmentações.</text>
<rect x="650" y="104" width="606" height="201" rx="22" fill="#DDEEFF" filter="url(#sh)"/>
<circle cx="694" cy="146" r="24" fill="#15365A"/>
<text x="694" y="154" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff">✦</text>
<text x="734" y="144" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="22" font-weight="700" fill="#15365A">O que pensa e sente?</text>
<text x="734" y="166" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-style="italic" fill="#3D5675">Base: [H] H01, H04</text>
<text x="690" y="196" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#1F2D3D" xml:space="preserve">• Quer eficiência e clareza nas análises.</text>
<text x="690" y="217" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#1F2D3D" xml:space="preserve">• Sente frustração quando precisa recorrer a scripts ou quando o</text>
<text x="690" y="238" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#1F2D3D" xml:space="preserve">  processamento demora.</text>
<text x="690" y="259" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#1F2D3D" xml:space="preserve">• Valoriza soluções práticas e visuais.</text>
<text x="690" y="280" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#1F2D3D" xml:space="preserve">• Orgulha-se de contribuir tecnicamente para o projeto Baja.</text>
<rect x="24" y="325" width="606" height="180" rx="22" fill="#DFF3E6" filter="url(#sh)"/>
<circle cx="68" cy="367" r="24" fill="#15365A"/>
<text x="68" y="375" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff">◉</text>
<text x="108" y="365" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="22" font-weight="700" fill="#15365A">O que vê?</text>
<text x="108" y="387" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-style="italic" fill="#3D5675">Base: [H] H04 · [F] locais dos testes (01 §5.1)</text>
<text x="64" y="417" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#1F2D3D" xml:space="preserve">• Imagens off-road com terrenos irregulares e poeira.</text>
<text x="64" y="438" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#1F2D3D" xml:space="preserve">• Colegas testando o carro e discutindo resultados.</text>
<text x="64" y="459" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#1F2D3D" xml:space="preserve">• Planilhas com métricas.</text>
<text x="64" y="480" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#1F2D3D" xml:space="preserve">• Laboratório e pistas de teste da FEI.</text>
<rect x="650" y="325" width="606" height="180" rx="22" fill="#ECE6FF" filter="url(#sh)"/>
<circle cx="694" cy="367" r="24" fill="#15365A"/>
<text x="694" y="375" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff">⚙</text>
<text x="734" y="365" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="22" font-weight="700" fill="#15365A">O que fala e faz?</text>
<text x="734" y="387" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-style="italic" fill="#3D5675">Base: [H] H04, H05</text>
<text x="690" y="417" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#1F2D3D" xml:space="preserve">• Compartilha resultados e capturas com a equipe.</text>
<text x="690" y="438" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#1F2D3D" xml:space="preserve">• Sugere ajustes e busca automatizar tarefas repetitivas.</text>
<text x="690" y="459" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#1F2D3D" xml:space="preserve">• Usa ferramentas gráficas sempre que possível e evita depender de</text>
<text x="690" y="480" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#1F2D3D" xml:space="preserve">  código.</text>
<rect x="24" y="525" width="606" height="243" rx="22" fill="#FDE1E3" filter="url(#sh)"/>
<circle cx="68" cy="567" r="24" fill="#15365A"/>
<text x="68" y="575" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff">!</text>
<text x="108" y="565" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="22" font-weight="700" fill="#15365A">Quais são as dores?</text>
<text x="108" y="587" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-style="italic" fill="#3D5675">Base: [F] scripts (01 §4.1, §4.6) · [H] H01, H05</text>
<text x="64" y="617" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#1F2D3D" xml:space="preserve">• Processos lentos e dependentes de scripts.</text>
<text x="64" y="638" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#1F2D3D" xml:space="preserve">• Legendas confusas entre uma execução e outra.</text>
<text x="64" y="659" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#1F2D3D" xml:space="preserve">• Dificuldade de comparar modelos e configurações.</text>
<rect x="650" y="525" width="606" height="243" rx="22" fill="#DDF3EE" filter="url(#sh)"/>
<circle cx="694" cy="567" r="24" fill="#15365A"/>
<text x="694" y="575" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff">✓</text>
<text x="734" y="565" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="22" font-weight="700" fill="#15365A">Quais são as necessidades e ganhos?</text>
<text x="734" y="587" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-style="italic" fill="#3D5675">Base: [H] H01, H06, H12</text>
<text x="690" y="617" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2D3D" xml:space="preserve">O que espera obter:</text>
<text x="690" y="638" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#1F2D3D" xml:space="preserve">• Entender se o modelo acertou a trilha, sem depender de código.</text>
<text x="690" y="659" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#1F2D3D" xml:space="preserve">• Reduzir o retrabalho de abrir arquivos e montar materiais a cada</text>
<text x="690" y="680" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#1F2D3D" xml:space="preserve">  teste.</text>
<text x="690" y="701" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#1F2D3D" xml:space="preserve">• Levar à equipe uma conclusão justificável, com seus limites.</text>
<text x="690" y="722" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-style="italic" fill="#1F2D3D" xml:space="preserve">• Implicações de design: comparação lado a lado, legenda Trilha × Fora</text>
<text x="690" y="743" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-style="italic" fill="#1F2D3D" xml:space="preserve">  da trilha e exportação.</text>
<rect x="104" y="792" width="1072" height="54" rx="8" fill="#15365A" filter="url(#sh)"/>
<text x="640.0" y="825" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff">“Rafael quer entender o resultado e responder à equipe antes do próximo teste, sem depender de código.”</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
