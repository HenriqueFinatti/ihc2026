<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" viewBox="0 0 900 510" width="900" height="510" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>CTT - Comparar resultados de diferentes modelos</title>
  <defs>
    <g id="abstract">
      <path d="M-16 13 C-27 13 -28 -2 -17 -4 C-17 -15 -2 -19 4 -11 C10 -18 23 -13 21 -4 C30 -2 29 13 18 13 Z" fill="#eef3fb" stroke="#1e1e1e" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
    <g id="interaction">
      <rect x="-17" y="-14" width="34" height="22" rx="2" fill="#eaf6ee" stroke="#1e1e1e" stroke-width="1.5"/>
      <line x1="-8" y1="14" x2="8" y2="14" stroke="#1e1e1e" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="0" y1="8" x2="0" y2="14" stroke="#1e1e1e" stroke-width="1.5"/>
      <path d="M4 -4 L4 10 L8 6.5 L11 12.5 L13.5 11.3 L10.6 5.5 L15.5 5.3 Z" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.2" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect width="900" height="510" fill="#ffffff"/>

  <g fill="none" stroke="#1e1e1e" stroke-width="1.5">
    <path d="M450 114 V140 M150 140 H750 M150 140 V168 M450 140 V168 M750 140 V168"/>
    <path d="M450 256 V292 M340 292 H560 M340 292 V328 M560 292 V328"/>
    <path d="M750 256 V328"/>
  </g>

  <g stroke="#1e1e1e" stroke-width="1.5" fill="none">
    <line x1="182" y1="190" x2="418" y2="190"/>
    <line x1="482" y1="190" x2="718" y2="190"/>
    <line x1="372" y1="350" x2="528" y2="350"/>
  </g>
  <g font-size="16" font-weight="bold" fill="#1e1e1e" text-anchor="middle">
    <text x="300" y="182">&gt;&gt;</text>
    <text x="600" y="182">|||</text>
    <text x="450" y="342">|=|</text>
  </g>

  <g font-size="14" fill="#1e1e1e" text-anchor="middle">
    <use xlink:href="#abstract" href="#abstract" x="450" y="50"/>
    <text x="450" y="90">0. Comparar resultados de</text>
    <text x="450" y="108">diferentes modelos</text>

    <use xlink:href="#interaction" href="#interaction" x="150" y="190"/>
    <text x="150" y="232">1. Segmentar imagem</text>
    <text x="150" y="250">com mais de um modelo</text>

    <use xlink:href="#abstract" href="#abstract" x="450" y="190"/>
    <text x="450" y="232">2. Comparar resultados</text>
    <text x="450" y="250">visualmente</text>

    <use xlink:href="#abstract" href="#abstract" x="750" y="190"/>
    <text x="750" y="232">3. Comparar métricas</text>

    <use xlink:href="#interaction" href="#interaction" x="340" y="350"/>
    <text x="340" y="392">2.1 Consultar a imagem</text>
    <text x="340" y="410">original</text>

    <use xlink:href="#interaction" href="#interaction" x="560" y="350"/>
    <text x="560" y="392">2.2 Consultar a imagem</text>
    <text x="560" y="410">segmentada</text>

    <use xlink:href="#interaction" href="#interaction" x="750" y="350"/>
    <text x="750" y="392">3.1 Consultar métricas</text>
    <text x="750" y="410">disponíveis</text>
  </g>

  <g font-size="12" fill="#1e1e1e">
    <use xlink:href="#abstract" href="#abstract" x="60" y="466"/>
    <text x="92" y="470">Tarefa abstrata</text>
    <use xlink:href="#interaction" href="#interaction" x="240" y="466"/>
    <text x="272" y="470">Tarefa de interação</text>
    <text x="440" y="470">&gt;&gt; habilitação   ||| concorrência   |=| qualquer ordem (ambas obrigatórias)</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
